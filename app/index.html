<!DOCTYPE html>
<html lang="nl">
<head>
    <meta charset="UTF-8">
    <meta
        name="viewport"
        content="width=device-width, initial-scale=1.0"
    >

    <title>Minecraft Navigation</title>

    <link
        rel="stylesheet"
        href="https://unpkg.com/maplibre-gl@^6.1.0/dist/maplibre-gl.css"
    >

    <style>
        html,
        body,
        #map {
            width: 100%;
            height: 100%;
            margin: 0;
        }
    </style>
</head>

<body>
<div id="map"></div>

<script type="module">
    import * as maplibregl
        from "https://unpkg.com/maplibre-gl@^6.1.0/dist/maplibre-gl.mjs";

    const map = new maplibregl.Map({
        container: "map",

        style: "https://tiles.openfreemap.org/styles/liberty",

        // Assen
        center: [6.562, 52.992],

        zoom: 13,

        pitch: 45,

        bearing: 0
    });

    map.addControl(
        new maplibregl.NavigationControl(),
        "top-right"
    );
</script>
</body>
</html>
